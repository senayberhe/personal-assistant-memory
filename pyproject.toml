[project]
name = "python-proj"
version = "0.1.0"
description = "Voice and text assistant with tool calling and long-term memory."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "gtts>=2.5.4",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "notebook>=7.6.3",
    "numpy>=2.5.3",
    "openai>=3.22.1",
    "pandas>=3.0.6",
    "pyaudio>=0.2.14",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "speechrecognition>=3.17.0",
    "streamlit>=1.65.0",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

# ---------------------------------------------------------------
# Tooling. Run everything from the repository root or chatting/:
#
#   uv run pytest
#   ruff check chatting
#   mypy
# ---------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["chatting/tests"]
# Lets tests import `assistant`, `config` and `services`
# no matter which directory pytest is started from.
pythonpath = ["chatting"]
addopts = "-q"
filterwarnings = [
    # speech_recognition imports the removed `aifc` module.
    "ignore:aifc was removed:DeprecationWarning",
]

[tool.ruff]
target-version = "py313"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "F",   # pyflakes: unused imports, undefined names
    "E9",  # syntax errors
    "B",   # bugbear: likely bugs
    "I",   # import sorting
    "UP",  # modern Python syntax
]

[tool.ruff.lint.isort]
known-first-party = ["assistant", "config", "services", "tests"]

[tool.mypy]
python_version = "3.13"
files = ["chatting/assistant", "chatting/services", "chatting/config", "chatting/main.py"]
mypy_path = "chatting"
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
